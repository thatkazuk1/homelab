name: _probe

on:
  pull_request:
    types: [closed]

jobs:
  probe:
    runs-on: docker
    steps:
      - name: Checkout
        run: |
          git init -q .
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@${GITHUB_SERVER_URL#https://}/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dump event + trigger info
        run: |
          echo "event_name=${{ github.event_name }}"
          echo "merged=${{ github.event.pull_request.merged }}"
          echo "merge_commit_sha=${{ github.event.pull_request.merge_commit_sha }}"
          echo "--- full event JSON ---"
          cat <<'PROBE_EOF'
          ${{ toJSON(github.event) }}
          PROBE_EOF

      - name: Try external uses (hello-world-docker-action)
        id: uses_probe
        continue-on-error: true
        uses: https://github.com/actions/hello-world-docker-action@main
        with:
          who-to-greet: "plane-transition-probe"

      - name: Report uses outcome
        if: always()
        run: echo "uses_outcome=${{ steps.uses_probe.outcome }}"

      - name: Try docker run of a public image
        id: docker_probe
        continue-on-error: true
        run: docker run --rm alpine:3 echo ok

      - name: Report docker outcome
        if: always()
        run: echo "docker_outcome=${{ steps.docker_probe.outcome }}"
