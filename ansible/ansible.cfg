[defaults]
inventory = inventory/hosts.yml
roles_path = roles
remote_user = kazuki
host_key_checking = True
retry_files_enabled = False
interpreter_python = auto_silent
# Every run appends here (host, timestamp, task, changed/ok/failed) — the
# closest thing to a deployment history for the baseline playbook, which is
# otherwise a stateless one-shot. Outside the repo (cwd-independent, not
# committed). no_log on the periphery secret tasks keeps credentials out of it.
log_path = ~/.ansible/homelab.log

[ssh_connection]
# accept-new: trust an unseen host key on first connect (expected for
# freshly-cloned guests), but still fail on a *changed* key instead of
# silently accepting it (host_key_checking=False would do that).
ssh_args = -o StrictHostKeyChecking=accept-new -o ControlMaster=auto -o ControlPersist=60s
pipelining = True
