---
# docker-prod-02 — first host provisioned genuinely fresh through the
# template-clone + Ansible flow (every other docker_hosts member was
# adopted in Sprint 4b with Docker/Periphery already running).
#
# A clean clone has no svc-docker group, no docker group, no kazuki
# group membership, and no /opt/homelab — the baseline role creates
# them. Adopted hosts leave baseline_managed unset (false) and the role
# is a no-op for them.
baseline_managed: true

# Everything else is the fleet standard, so no other overrides:
#   - periphery_env_file: false      (inline ${PERIPHERY_CORE_PUBLIC_KEYS} via .env)
#   - periphery_stack_dir_mode: "02775"
#   - periphery_files_group: svc-docker
#   - docker_apt_deb822: false       (legacy one-line repo, like 7/8 of the fleet)
#   - no Hawser (the docker_hosts play is docker + periphery only)

# Host firewall (roles/host_firewall).
# 5355 (LLMNR) is not allowed on purpose. It shows in the would-drop sets.
host_firewall_hawser: true
host_firewall_host_rules:
  - ports: [3001, 3004, 8100, 4000]
    proto: tcp
    sources: ["{{ host_firewall_addr_proxy }}"]
    comment: web services and litellm behind traefik
