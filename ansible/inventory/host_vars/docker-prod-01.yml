---
# docker-prod-01 runs Dockhand itself (manages its own host via the
# local socket) — no Hawser sidecar needed.
hawser_enabled: false

# Confirmed real, documented drift (Sprint 3i status report, and this
# host's stacks/komodo-periphery/compose.docker-prod-01.yml x-meta
# comment): this Periphery gets PERIPHERY_CORE_PUBLIC_KEYS,
# KOMODO_CORE_ADDRESS, and PERIPHERY_PASSKEYS via a host-local .env
# (env_file:), and adds a PERIPHERY_DISABLE_CONTAINER_EXEC line — the
# other 5 standard hosts have none of this. Ansible does not manage or
# regenerate that .env file (PERIPHERY_PASSKEYS is a real credential
# with no tracked source — it lives only on the host); the role just
# needs to reproduce the compose shape that already consumes it.
# Container exec is disabled since 2026-10-09 (security hardening).
periphery_env_file: true
periphery_disable_container_exec: true

# Real, audited mode for /opt/homelab/komodo-periphery — differs from
# the 02775 default (setgid, but no group-write). See periphery role
# defaults for why this isn't normalized.
periphery_stack_dir_mode: "02755"

# Sole fleet host already on the newer DEB822 apt-source format for
# Docker's repo (every other host uses the legacy one-line format —
# see docker role defaults).
docker_apt_deb822: true

# Host firewall (roles/host_firewall).
# No Hawser agent here (Dockhand runs on this host).
# 45876/tcp (beszel-agent, host network) is reached from Docker bridges,
# so host_firewall_container_cidrs already covers it.
# 111 (rpcbind) is not allowed on purpose. It shows in the would-drop sets.
host_firewall_host_rules:
  - ports: [3000, 3001, 3050, 8000, 8090, 9898]
    proto: tcp
    sources: ["{{ host_firewall_addr_proxy }}"]
    comment: web services behind traefik
  - ports: [41641]
    proto: udp
    sources: any
    comment: tailscale direct connections
