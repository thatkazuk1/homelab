---
# Fleet hosts land here in 4b. For 4a, only the scratch/test group exists.
all:
  children:
    scratch:
      hosts:
        # Populated at Phase 3 execution time with the DHCP lease address
        # the cloned guest actually receives. Prefer adding a matching
        # Host block to ~/.ssh/config (per-host key convention, see
        # handbook/docs/getting-started/ssh.md) over hardcoding a raw IP
        # here where avoidable.
        scratch-01:
          # Resolved via ~/.ssh/config's scratch-01 Host block (per-host key
          # convention), not a hardcoded IP — the DHCP lease can change.
          ansible_host: scratch-01
