---
# Real fleet inventory, Sprint 4b. One group (docker_hosts) for all 8
# Proxmox guests; exceptions live in host_vars, not as separate groups.
# ansible_host values resolve via each host's ~/.ssh/config Host block
# (per-host key convention) rather than hardcoded IPs.
all:
  children:
    docker_hosts:
      hosts:
        telemetry-prod-01:
          ansible_host: telemetry-prod-01
        plane-prod-01:
          ansible_host: plane-prod-01
        coolify-prod-01:
          ansible_host: coolify-prod-01
        garage-prod-01:
          ansible_host: garage-prod-01
        forgejo-prod-01:
          ansible_host: forgejo-prod-01
        docker-prod-01:
          ansible_host: docker-prod-01
        proxy-prod-01:
          ansible_host: proxy-prod-01
        komodo-prod-01:
          ansible_host: komodo-prod-01
    scratch:
      hosts:
        # Populated at Phase 3 execution time with the DHCP lease address
        # the cloned guest actually receives. Prefer adding a matching
        # Host block to ~/.ssh/config (per-host key convention, see
        # handbook/docs/getting-started/ssh.md) over hardcoding a raw IP
        # here where avoidable.
        scratch-01:
          # Resolved via ~/.ssh/config's scratch-01 Host block (per-host key
          # convention), not a hardcoded IP — the DHCP lease can change.
          ansible_host: scratch-01
