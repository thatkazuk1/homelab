---
# The scratch group is a throwaway guest used only to prove the
# provision-baseline.yml path end-to-end (Sprint 4a). It is not
# Dockhand-registered, so hawser_token here is a placeholder, not a
# real fleet secret pulled via community.sops.
#
# Real fleet hosts (4b) get a real token generated in the Dockhand UI
# (operator action, per ADR-0013) and stored in
# stacks/hawser/secrets.enc.env as HAWSER_TOKEN_<HOST>, looked up like:
#
#   hawser_token: "{{ lookup('community.sops.sops',
#                      playbook_dir + '/../../stacks/hawser/secrets.enc.env',
#                      input_type='dotenv', output_type='dotenv',
#                      extract='[\"HAWSER_TOKEN_' + inventory_hostname_short
#                        | upper | replace('-', '_') + '\"]') }}"
#
# For scratch-01, pass a real value at run time instead:
#   ansible-playbook playbooks/provision-baseline.yml -e hawser_token=<value>
hawser_token: scratch-placeholder-token
