---
- name: Install prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - python3-debian
    state: present
    update_cache: true

- name: Create apt keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Download Docker's official GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/debian/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Add Docker's APT repository (DEB822 format)
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: https://download.docker.com/linux/debian
    suites: "{{ ansible_distribution_release }}"
    components: stable
    architectures: "{{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' }}"
    signed_by: /etc/apt/keyrings/docker.asc
    state: present
  when: docker_apt_deb822

- name: Add Docker's APT repository (legacy one-line format)
  ansible.builtin.template:
    src: docker.list.j2
    dest: /etc/apt/sources.list.d/docker.list
    mode: "0644"
  when: not docker_apt_deb822

- name: Install Docker CE
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Ensure docker service is enabled and running
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started

- name: Verify docker version
  ansible.builtin.command: docker version
  register: docker_version_out
  changed_when: false

# Make network-online.target wait for the DHCP lease. ifup@<iface>.service
# is a simple unit, so ifupdown does not wait for dhcpcd by itself. The
# route method waits for a default route. dhcpcd adds the route after it
# writes /etc/resolv.conf, so the nameserver exists when Docker starts.
# docker.service already has After=network-online.target, so it needs no
# drop-in. If the route never comes, the wait ends after the timeout and
# Docker starts (the target only Wants the wait unit).
# Apply only these tasks:  --tags docker_wait_for_route
- name: Wait for the default route before network-online.target
  when: docker_wait_for_default_route | bool
  tags: [docker_wait_for_route]
  block:
    - name: Set the ifupdown wait-online method and timeout
      ansible.builtin.lineinfile:
        path: /etc/default/networking
        regexp: '^#?\s*{{ item.key }}='
        line: "{{ item.key }}={{ item.value }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - { key: WAIT_ONLINE_METHOD, value: route }
        - { key: WAIT_ONLINE_TIMEOUT, value: "{{ docker_wait_for_default_route_timeout }}" }

    - name: Enable ifupdown-wait-online.service
      ansible.builtin.systemd_service:
        name: ifupdown-wait-online.service
        enabled: true
