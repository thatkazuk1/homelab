x-meta:
  name: hawser-nas-01
  host: nas-01
  category: orchestration
  description: >
    Hawser agent for Dockhand remote management. Edge mode: the agent
    connects out to Dockhand over WebSocket (wss through Traefik) and
    authenticates with the TOKEN env var. No port is published on the host.
  status: adopted
  adrs:
    - 8
    - 12

services:
  hawser:
    image: ghcr.io/finsys/hawser:latest
    container_name: hawser
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - TOKEN=${HAWSER_TOKEN_NAS_01}
      - DOCKHAND_SERVER_URL=wss://dockhand.ts.kazuki.uk/api/hawser/connect
