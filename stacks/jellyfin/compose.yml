x-meta:
  name: jellyfin
  host: nas-01
  category: media
  description: >
    Jellyfin media server running as one compose project on nas-01. Watch-history tracking moved to Tracearr (stacks/tracearr); Jellystat is retired.
  status: adopted
  adrs:
    - 8

name: jellyfin

services:
  jellyfin:
    image: ghcr.io/jellyfin/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    user: "1006:997"
    group_add:
      - "109"
    environment:
      - TZ=Africa/Lagos
    volumes:
      - /Volume1/@apps/homelab/jellyfin/jellyfin/config:/config
      - /Volume1/@apps/homelab/jellyfin/jellyfin/cache:/cache
      - /Volume1/data/media:/data/media
    ports:
      - 8096:8096
    devices:
      - /dev/dri:/dev/dri
