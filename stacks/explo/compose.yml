x-meta:
  name: explo
  host: nas-01
  category: media
  description: >
    Generates weekly/monthly/daily discovery playlists from ListenBrainz
    recommendations, downloading singles via slskd into music/explo/ and
    creating matching playlists in Navidrome. Configured via its own
    first-run web setup wizard, not env vars.
  status: adopted
  adrs:
    - 8

name: explo

services:
  explo:
    image: ghcr.io/lumepart/explo:latest
    container_name: explo
    restart: unless-stopped
    user: "1006:997"
    ports:
      - "7288:7288"
    environment:
      - TZ=Africa/Lagos
      - WEB_UI=true
      - UI_USERNAME
      - UI_PASSWORD
    volumes:
      - /Volume1/@apps/homelab/explo/config:/opt/explo/config
      - /Volume1/@apps/homelab/explo/.env:/opt/explo/.env
      - /Volume1/nexus-pve/media/music/explo:/data
      - /Volume1/nexus-pve/downloads:/slskd
