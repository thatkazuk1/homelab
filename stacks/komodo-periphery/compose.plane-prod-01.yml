# Meta-infrastructure — not Komodo-managed.
# Deployed and updated manually on plane-prod-01.
# This file documents the running config. It does not deploy.
# The compose body below is a copy of /opt/homelab/komodo-periphery/compose.yml
# on the host (compared 2026-10-09). Do not copy this file over the host file:
# the host file is the deployed state, and this file adds the x-meta block.
# The compose project and the file match the Ansible `periphery` role template.
# `PERIPHERY_CORE_PUBLIC_KEYS` comes from the `.env` file next to the compose file.

x-meta:
  name: komodo-periphery-plane-prod-01
  host: plane-prod-01
  category: meta-infra
  description: >
    Custom Komodo Periphery agent (sops + age baked in) enabling
    `sops exec-env` secret decryption at deploy time. Deployed and
    updated manually per host — not Komodo-managed itself (bootstrap
    circularity: Komodo can't manage the agent that runs Komodo's
    per-host connection).
  status: meta-infra
  adrs:
    - 5

name: komodo-periphery

services:
  periphery:
    image: forgejo.ts.kazuki.uk/shokunbi/komodo-periphery-sops:2
    container_name: komodo-periphery
    restart: unless-stopped
    init: true
    ports:
      - "8120:8120"
    environment:
      - PERIPHERY_ROOT_DIRECTORY=/etc/komodo
      - PERIPHERY_DISABLE_TERMINALS=true
      - PERIPHERY_CORE_PUBLIC_KEYS=${PERIPHERY_CORE_PUBLIC_KEYS}
      - SOPS_AGE_KEY_FILE=/config/age-keys.txt
      - DOCKER_CONFIG=/config/docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /proc:/proc
      - /etc/komodo:/etc/komodo
      - ./keys:/config/keys
      - /home/kazuki/.config/sops/age/keys.txt:/config/age-keys.txt:ro
      - /opt/homelab/komodo-periphery/docker-config:/config/docker
