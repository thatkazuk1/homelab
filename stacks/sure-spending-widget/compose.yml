name: sure-spending-widget

x-meta:
  name: sure-spending-widget
  host: docker-prod-01
  category: automation
  description: >
    Cron job that calls Sure Finance's MCP endpoint for the current week and
    month-to-date spend, and writes a flat JSON file that Homepage's
    "Spent This Week" / "Spent This Month" customapi widgets read as a
    static file. Exists because neither Sure's REST API nor Homepage's
    customapi widget can do the aggregation on their own - see notes.md.
  status: new
  adrs:
    - 8

services:
  aggregator:
    image: alpine:3.20
    restart: unless-stopped
    environment:
      TZ: "Africa/Lagos"
      SURE_URL: https://sure.ts.kazuki.uk
      MCP_API_TOKEN: ${MCP_API_TOKEN}
      MCP_USER_EMAIL: ${MCP_USER_EMAIL}
      # Komodo's "If Changed" diffs resolved `docker compose config`, not the
      # bind-mounted generate.sh's bytes - a script-only edit is otherwise
      # invisible to it and never triggers a redeploy or even a repo re-pull.
      # Bump this whenever generate.sh changes so the resolved config actually
      # differs and Komodo picks the new script up.
      GENERATE_SH_VERSION: "2"
    volumes:
      - ./generate.sh:/generate.sh:ro
      - /opt/homelab/homepage/assets/data:/output
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "set -e &&
       apk add --no-cache curl jq tzdata >/dev/null &&
       sh /generate.sh &&
       echo '*/15 * * * * sh /generate.sh >>/proc/1/fd/1 2>>/proc/1/fd/2' | crontab - &&
       crond -f -l 2"
