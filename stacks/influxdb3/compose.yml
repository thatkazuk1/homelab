x-meta:
  name: influxdb3
  host: telemetry-prod-01
  category: monitoring
  description: >
    Time-series database (InfluxDB 3 Core + Explorer) backing the fleet's
    telemetry data, such as speedtest history.
  status: adopted

services:
  influxdb3-core:
    image: influxdb:3-core
    container_name: influxdb3-core
    restart: unless-stopped
    ports:
      - 8181:8181
    command:
      - influxdb3
      - serve
      - --node-id=telemetry-prod-01
      - --object-store=file
      - --data-dir=/var/lib/influxdb3/data
      - --plugin-dir=/var/lib/influxdb3/plugins
      # Core has no compaction: about one Parquet file per write period.
      # The default limit (432) stops speedtest queries longer than 7 days.
      # 5000 covers about 80 days of speedtest data. Higher is not safe on a
      # 2 GB VM, because a dashboard runs many queries at the same time.
      - --query-file-limit=5000
    volumes:
      - /opt/homelab/influxdb3/data:/var/lib/influxdb3/data
      - /opt/homelab/influxdb3/plugins:/var/lib/influxdb3/plugins

  influxdb3-explorer:
    image: influxdata/influxdb3-ui:1.11.0
    container_name: influxdb3-explorer
    restart: unless-stopped
    ports:
      - "8888:8080"
      - "8889:8888"
    volumes:
      - /opt/homelab/influxdb3/config:/app-root/config:ro
      - /opt/homelab/influxdb3/explorer-db:/db
    command: ["--mode=admin"]
    environment:
      # Fixed key, so sessions (and the dashboards that belong to them)
      # survive a restart. Without it Explorer makes a new key at each start.
      - SESSION_SECRET_KEY
    depends_on:
      - influxdb3-core
