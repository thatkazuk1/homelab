# yaml-language-server: $schema=https://schemas.recyclarr.dev/v8/config-schema.json
################################################################################
## TRaSH Guides: [Anime] Remux-1080p, adapted for nas-01
##
## Sonarr  https://trash-guides.info/Sonarr/sonarr-setup-quality-profiles-anime/
## Radarr  https://trash-guides.info/Radarr/radarr-setup-quality-profiles-anime/
##
## Changes from the guide template (both apps):
##  - The Remux quality is removed (TRaSH FAQ). The pool has no redundancy and
##    a Remux is very large. The top quality is Bluray-1080p.
##  - "Upgrade Until" is Bluray-1080p, with the guide's score limit of 10000.
##  - The quality size definition is the standard one (series, movie), because a
##    single instance holds both anime and normal content.
##  - Anime Dual Audio keeps the guide score, 0. The operator watches in Japanese
##    with English subtitles, so a dual audio release gets no bonus and the ranking
##    follows the release group tiers. To prefer dual audio, add a custom_formats
##    entry with the score 10 (inside a tier), 101 (one tier up) or 2000 (above all).
##
## Secrets: SONARR_API_KEY and RADARR_API_KEY come from secrets.enc.env.
## The apps are reached through the published ports on nas-01.
################################################################################

sonarr:
  sonarr-anime:
    base_url: http://nas-01.lan:8989
    api_key: !env_var SONARR_API_KEY

    # The size limits apply to the whole app, not to one profile. A single
    # instance uses the standard definition (TRaSH guide note).
    quality_definition:
      type: series

    quality_profiles:
      - trash_id: 20e0fc959f1f1704bed501f23bdae76f  # [Anime] Remux-1080p
        reset_unmatched_scores:
          enabled: true
        upgrade:
          allowed: true
          until_quality: Bluray-1080p
          until_score: 10000
        qualities:
          - name: Bluray-1080p
          - name: WEB 1080p
            qualities:
              - HDTV-1080p
              - WEBRip-1080p
              - WEBDL-1080p
          - name: Bluray-720p
          - name: WEB 720p
            qualities:
              - HDTV-720p
              - WEBRip-720p
              - WEBDL-720p
          - name: Bluray-480p
          - name: WEB 480p
            qualities:
              - WEBRip-480p
              - WEBDL-480p
          - name: DVD
          - name: SDTV


radarr:
  radarr-anime:
    base_url: http://nas-01.lan:7878
    api_key: !env_var RADARR_API_KEY

    quality_definition:
      type: movie

    quality_profiles:
      - trash_id: 722b624f9af1e492284c4bc842153a38  # [Anime] Remux-1080p
        reset_unmatched_scores:
          enabled: true
        upgrade:
          allowed: true
          until_quality: Bluray-1080p
          until_score: 10000
        qualities:
          - name: Bluray-1080p
          - name: WEB 1080p
            qualities:
              - HDTV-1080p
              - WEBRip-1080p
              - WEBDL-1080p
          - name: Bluray-720p
          - name: WEB 720p
            qualities:
              - HDTV-720p
              - WEBRip-720p
              - WEBDL-720p
          - name: Bluray-576p
          - name: Bluray-480p
          - name: WEB 480p
            qualities:
              - WEBRip-480p
              - WEBDL-480p
          - name: DVD
          - name: SDTV
