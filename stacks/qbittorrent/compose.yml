x-meta:
  name: qbittorrent
  host: nas-01
  category: download
  description: >
    qBittorrent torrent client routed entirely through Gluetun's VPN tunnel (network_mode: service:gluetun) for IP isolation.
  status: adopted
  adrs:
    - 8

name: qbittorrent

services:
  gluetun:
    image: qmcgaw/gluetun
    container_name: gluetun
    restart: unless-stopped
    ports:
      - 8000:8000
      - 8000:8000/tcp
      - 8080:8080
      - 8388:8388/tcp
      - 8388:8388/udp
      - 8888:8888/tcp
      - 8999:8999/tcp
      - 8999:8999/udp
    volumes:
      - gluetun-data:/gluetun
      - /Volume1/@apps/homelab/qBittorrent/config.toml:/gluetun/auth/config.toml:ro
    # The image's own healthcheck (5s interval, 1 retry, 10s start period) is
    # tighter than a VPN cold start: gluetun's first check often fails, it
    # restarts the VPN internally, and ~30s later is fine — but by then
    # `compose up` has already aborted with "gluetun is unhealthy" and left
    # qbittorrent in Created. Only the timings are overridden; the test
    # command is inherited from the image.
    healthcheck:
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 120s
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - PUID=1006
      - PGID=997
      - TZ=Africa/Lagos
      - VPN_TYPE=wireguard
      - VPN_SERVICE_PROVIDER=protonvpn
      - WIREGUARD_PRIVATE_KEY
      - SERVER_COUNTRIES=Netherlands,Switzerland,Iceland
      - UPDATER_PERIOD=24h
      - VPN_PORT_FORWARDING=on
      - VPN_PORT_FORWARDING_PROVIDER=protonvpn
      - GLUETUN_API_KEY
      - GLUETUN_USER
      - GLUETUN_PASSWORD
      - GSP_GTN_API_KEY

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
        # qbittorrent lives in gluetun's network namespace; if gluetun is
        # recreated/restarted, the old namespace goes stale and the WebUI
        # stops answering until qbittorrent is restarted too.
        restart: true
    mem_limit: 3g
    memswap_limit: 3g
    # Self-healing for the actual failure mode: qbittorrent's namespace goes
    # stale any time gluetun restarts for a reason Compose isn't involved in
    # (its own VPN healthcheck, a daemon-level unless-stopped restart after a
    # crash, a manual restart from TOS) — none of those trigger the
    # depends_on.restart hook above, which only fires on a Compose-driven
    # recreate of gluetun. This checks the symptom (WebUI unreachable)
    # instead of chasing every possible cause; autoheal (below) restarts it
    # when this goes unhealthy.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - autoheal=true
    volumes:
      - /Volume1/nexus-pve/downloads:/downloads
      - /Volume1/@apps/homelab/qBittorrent/qbittorrent/config:/config
    environment:
      - PUID=1006
      - PGID=997
      - TZ=Africa/Lagos
      - WEBUI_PORT=8080
      - DOCKER_MODS=ghcr.io/t-anc/gsp-qbittorent-gluetun-sync-port-mod:main
      - GSP_MINIMAL_LOGS=false
      - GSP_GTN_API_KEY
      - VPN_TYPE=wireguard
      - VPN_SERVICE_PROVIDER=protonvpn
      - WIREGUARD_PRIVATE_KEY
      - SERVER_COUNTRIES=Netherlands,Switzerland,Iceland
      - GLUETUN_API_KEY
      - GLUETUN_USER
      - GLUETUN_PASSWORD

  # Restarts any container in this stack labeled autoheal=true once Docker
  # reports it unhealthy. Only qbittorrent carries the label today — gluetun
  # already restarts itself internally on its own healthcheck failure, and
  # doing it again from the outside would just race that. Scoped to this
  # stack, not a fleet-wide utility: qbittorrent is the only stack on nas-01
  # with a network_mode: service:X dependency, so it's the only one that
  # needs a restart trigger Compose itself can't provide.
  autoheal:
    image: willfarrell/autoheal
    container_name: autoheal
    restart: unless-stopped
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=10
      - AUTOHEAL_START_PERIOD=60
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  gluetun-data:
