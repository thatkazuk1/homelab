x-meta:
  name: qbittorrent
  host: nas-01
  category: download
  description: >
    qBittorrent torrent client routed entirely through Gluetun's VPN tunnel (network_mode: service:gluetun) for IP isolation.
  status: adopted
  adrs:
    - 8

name: qbittorrent

services:
  gluetun:
    image: qmcgaw/gluetun
    container_name: gluetun
    restart: unless-stopped
    ports:
      - 8000:8000
      - 8080:8080
    volumes:
      - gluetun-data:/gluetun
      - /Volume1/@apps/homelab/qBittorrent/config.toml:/gluetun/auth/config.toml:ro
    healthcheck:
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 120s
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - PUID=1006
      - PGID=997
      - TZ=Africa/Lagos
      - VPN_TYPE=wireguard
      - VPN_SERVICE_PROVIDER=protonvpn
      - WIREGUARD_PRIVATE_KEY
      - SERVER_COUNTRIES=Netherlands,Switzerland,Iceland
      - UPDATER_PERIOD=24h
      - VPN_PORT_FORWARDING=on
      - VPN_PORT_FORWARDING_PROVIDER=protonvpn
      - GLUETUN_API_KEY
      - GLUETUN_USER
      - GLUETUN_PASSWORD
      - GSP_GTN_API_KEY
      - FIREWALL_INPUT_PORTS=8080
      - DOT=on
      - DOT_PROVIDERS=cloudflare
      - PORT_FORWARD_ONLY=on

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    mem_limit: 3g
    memswap_limit: 3g
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - autoheal=true
    volumes:
      - /Volume1/nexus-pve/downloads:/downloads
      - /Volume1/@apps/homelab/qBittorrent/qbittorrent/config:/config
    environment:
      - PUID=1006
      - PGID=997
      - TZ=Africa/Lagos
      - WEBUI_PORT=8080
      - DOCKER_MODS=ghcr.io/t-anc/gsp-qbittorent-gluetun-sync-port-mod:main
      - GSP_MINIMAL_LOGS=false
      - GSP_GTN_API_KEY

  autoheal:
    image: willfarrell/autoheal
    container_name: autoheal
    restart: unless-stopped
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=10
      - AUTOHEAL_START_PERIOD=60
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  gluetun-data:
