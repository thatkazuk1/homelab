# Telegraf config for AdGuard Home DNS statistics.
# Telegraf reads the AdGuard query log and writes one hourly summary row for
# each client, reason, query type and upstream to InfluxDB 3.
# The parser reads only the listed JSON paths. The domain key QH is not listed,
# so the domain never enters Telegraf or InfluxDB.

[agent]
  interval = "10s"
  flush_interval = "30s"
  omit_hostname = true
  skip_processors_after_aggregators = true
  # The state file keeps the read offset of the log across container restarts.
  statefile = "/var/lib/telegraf/telegraf.state"

[[inputs.tail]]
  files = ["/adguard/querylog/querylog.json"]
  initial_read_offset = "saved-or-end"
  watch_method = "inotify"
  path_tag = ""
  max_undelivered_lines = 2000
  data_format = "json_v2"
  [[inputs.tail.json_v2]]
    measurement_name = "dns_raw"
    timestamp_path = "T"
    timestamp_format = "2006-01-02T15:04:05.999999999Z07:00"
    timestamp_timezone = "UTC"
    [[inputs.tail.json_v2.tag]]
      path = "IP"
      rename = "client"
    [[inputs.tail.json_v2.tag]]
      path = "QT"
      rename = "qtype"
    [[inputs.tail.json_v2.tag]]
      path = "Result.Reason"
      rename = "reason"
      optional = true
    [[inputs.tail.json_v2.tag]]
      path = "Upstream"
      rename = "upstream"
      optional = true
    [[inputs.tail.json_v2.field]]
      path = "Elapsed"
      rename = "elapsed_ns"
      type = "int"
    [[inputs.tail.json_v2.field]]
      path = "Cached"
      rename = "cached"
      type = "bool"

# Map the AdGuard reason code to a name. A missing reason means code 0.
# A missing upstream means a cached, blocked or rewritten answer.
[[processors.starlark]]
  namepass = ["dns_raw"]
  source = '''
R = {"0": "none", "1": "allowlist", "2": "error", "3": "blocklist", "4": "safebrowsing", "5": "parental", "6": "invalid", "7": "safesearch", "8": "blocked_service", "9": "rewrite", "10": "rewrite_hosts", "11": "rewrite_rule"}
def apply(metric):
    metric.tags["reason"] = R.get(metric.tags.get("reason", "0"), "other")
    if "upstream" not in metric.tags:
        metric.tags["upstream"] = "none"
    metric.fields["elapsed_ms"] = float(metric.fields.pop("elapsed_ns")) / 1000000.0
    metric.fields["cached"] = 1 if metric.fields["cached"] else 0
    return metric
'''

# One summary row for each tag set in each period.
[[aggregators.basicstats]]
  namepass = ["dns_raw"]
  period = "1h"
  grace = "1h"
  drop_original = true
  name_override = "dns_queries"
  stats = ["count", "mean", "max", "sum"]

[[outputs.influxdb_v3]]
  namepass = ["dns_queries"]
  # Keep four fields: elapsed_ms_count, elapsed_ms_mean, elapsed_ms_max, cached_sum.
  fieldexclude = ["elapsed_ms_sum", "cached_count", "cached_mean", "cached_max"]
  urls = ["http://192.168.50.106:8181"]
  token = "${INFLUX_TOKEN}"
  database = "adguard-dns"
