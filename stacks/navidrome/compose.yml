x-meta:
  name: navidrome
  host: nas-01
  category: media
  description: >
    Navidrome music server (Subsonic/OpenSubsonic API) serving the shared
    music library on nas-01, read-only. Paired with Lidarr (stacks/media)
    for acquisition and any Subsonic-compatible client (e.g. Symfonium) for
    playback.
  status: adopted
  adrs:
    - 8

name: navidrome

services:
  navidrome:
    image: deluan/navidrome:latest
    container_name: navidrome
    restart: always
    user: "1006:997"
    dns:
      - 1.1.1.1
      - 8.8.8.8
    ports:
      - "4533:4533"
    environment:
      - ND_MUSICFOLDER=/media/music
      - ND_DATAFOLDER=/data
      # The current name is ND_SCANNER_SCHEDULE. The file watcher (5 s) already scans after a
      # Lidarr import; the hourly scan is a safety net.
      - ND_SCANNER_SCHEDULE=@every 1h
      - ND_LOGLEVEL=info
      # Privacy and exposure: no anonymous usage data, and no public share links
      # (the service is reachable from the internet).
      - ND_ENABLEINSIGHTSCOLLECTOR=false
      - ND_ENABLESHARING=false
      # Search matches anywhere in a name, not only at the start of a word.
      - ND_SEARCH_FULLSTRING=true
      - TZ=Africa/Lagos
      - ND_LASTFM_APIKEY
    volumes:
      - /Volume1/@apps/homelab/navidrome/data:/data
      - /Volume1/data/media/music:/media/music:ro
