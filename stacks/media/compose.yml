x-meta:
  name: media
  host: nas-01
  category: media
  description: >
    Arr-stack media automation running as one compose project on nas-01:
    Seerr, FlareSolverr, Prowlarr, Radarr, Sonarr, Bazarr, Lidarr.
  status: adopted
  adrs:
    - 8

name: media

services:
  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    restart: unless-stopped
    init: true
    user: "1006:997"
    volumes:
      - /Volume1/@apps/homelab/media/seerr/config:/app/config
    networks:
      - media-internal
    ports:
      - "5055:5055"
    environment:
      - PUID=1006
      - PGID=997
      - LOG_LEVEL=debug
      - TZ=Africa/Lagos
      # Node gives each address 250 ms to connect. The connect time from nas-01 to
      # GitHub's CDN is about 300 ms, so the anime list download failed on every
      # address and the Jellyfin sync stopped every 5 minutes. 2000 ms fixes it.
      - NODE_OPTIONS=--network-family-autoselection-attempt-timeout=2000
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/status || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    restart: unless-stopped
    ports:
      - "8191:8191"
    networks:
      - media-internal
    environment:
      - LOG_LEVEL=info
      - TZ=Africa/Lagos

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped
    ports:
      - "9696:9696"
    volumes:
      - /Volume1/@apps/homelab/media/prowlarr/config:/config
    networks:
      - media-internal
    environment:
      - PUID=1006
      - PGID=997
      - TZ=Africa/Lagos

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    ports:
      - "7878:7878"
    volumes:
      - /Volume1/data:/data
      - /Volume1/@apps/homelab/media/radarr/config:/config
    networks:
      - media-internal
    environment:
      - PUID=1006
      - PGID=997
      - TZ=Africa/Lagos

  sonarr:
    # v5 beta. Its database migration is one-way: restore a config backup to return to v4.
    image: lscr.io/linuxserver/sonarr:develop-version-5.0.0.2569
    container_name: sonarr
    restart: unless-stopped
    ports:
      - "8989:8989"
    volumes:
      - /Volume1/data:/data
      - /Volume1/@apps/homelab/media/sonarr/config:/config
    networks:
      - media-internal
    environment:
      - PUID=1006
      - PGID=997
      - TZ=Africa/Lagos

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    restart: unless-stopped
    ports:
      - "6767:6767"
    volumes:
      - /Volume1/data/media:/data/media
      - /Volume1/@apps/homelab/media/bazarr/config:/config
    networks:
      - media-internal
    environment:
      - PUID=1006
      - PGID=997
      - TZ=Africa/Lagos

  lidarr:
    image: lscr.io/linuxserver/lidarr:nightly
    container_name: lidarr
    restart: unless-stopped
    ports:
      - "8686:8686"
    volumes:
      - /Volume1/data:/data
      - /Volume1/@apps/homelab/media/lidarr/config:/config
    networks:
      - media-internal
    environment:
      - PUID=1006
      - PGID=997
      - TZ=Africa/Lagos

networks:
  media-internal:
    name: media-internal
