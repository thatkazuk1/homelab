x-meta:
  name: litellm
  host: docker-prod-02
  category: ai-gateway
  description: >
    LiteLLM proxy — a single OpenAI-compatible endpoint in front of the
    fleet's Ollama hosts (ollama-prod-01, nexus-v), so consumers (Sure,
    SparkyFitness) stop hardcoding a backend URL. Backed by its own Postgres
    for the Admin UI (/ui — login, virtual keys, spend/request history).
    Model routing itself stays in config.yaml, not the database
    (STORE_MODEL_IN_DB deliberately unset), so git remains the source of
    truth for what's routed where — the DB only backs UI/key/usage state.
  status: new
  adrs:
    - 8

name: litellm

services:
  litellm-db:
    image: postgres:18.3-alpine
    container_name: litellm-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: litellm
      # sops exec-env injects this; bare pass-through per ADR-0008. The ${...:-}
      # form keeps `docker compose config` (Komodo's change-detection) quiet
      # when the wrapper isn't in play, matching the rest of the fleet.
      POSTGRES_PASSWORD: ${LITELLM_DB_PASSWORD:-}
    volumes:
      - litellm-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 10s
      timeout: 5s
      retries: 5

  litellm:
    image: ghcr.io/berriai/litellm:v1.83.14-stable
    container_name: litellm
    restart: unless-stopped
    depends_on:
      litellm-db:
        condition: service_healthy
    command: ["--config", "/app/proxy_server_config.yaml", "--port", "4000"]
    ports:
      - "4000:4000"
    environment:
      # sops exec-env injects both; bare pass-through per ADR-0008.
      LITELLM_MASTER_KEY:
      # DATABASE_URL is LiteLLM's documented primary mechanism (plain env
      # var, not a config.yaml key) — the proxy detects it and runs its own
      # schema migration on startup. Built from LITELLM_DB_PASSWORD the same
      # way other adopted stacks build a DB URL (e.g. kinboard).
      DATABASE_URL: postgresql://litellm:${LITELLM_DB_PASSWORD:-}@litellm-db:5432/litellm
    volumes:
      - ./config.yaml:/app/proxy_server_config.yaml:ro
    healthcheck:
      # No API key required for this endpoint (see LiteLLM's health docs).
      # curl/wget presence in this image isn't confirmed, so use python3,
      # which every litellm image ships.
      test: ["CMD", "python3", "-c", "import urllib.request as u; u.urlopen('http://localhost:4000/health/liveliness')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  litellm-db-data:
    name: litellm-db-data
