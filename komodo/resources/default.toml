[[repo]]
name = "kazuki/homelab"
[repo.config]
git_provider = "forgejo.ts.kazuki.uk"
git_account = "kazuki"
repo = "kazuki/homelab"
branch = "master"

##

[[procedure]]
name = "Backup Core Database"
description = "Triggers the Core database backup at the scheduled time."
tags = ["system"]
config.schedule = "Every day at 01:00"

[[procedure.config.stage]]
name = "Stage 1"
enabled = true
executions = [
  { execution.type = "BackupCoreDatabase", execution.params = {}, enabled = true }
]

##

[[procedure]]
name = "Global Auto Update"
description = "Pulls and auto updates Stacks and Deployments using 'poll_for_updates' or 'auto_update'."
tags = ["system"]
config.schedule = "Every day at 03:00"

[[procedure.config.stage]]
name = "Stage 1"
enabled = true
executions = [
  { execution.type = "GlobalAutoUpdate", execution.params.skip_auto_update = false, enabled = true }
]

##

[[procedure]]
name = "Rotate Server Keys"
description = "Rotates all currently connected Server keys."
tags = ["system"]
config.schedule = "Every day at 06:00"

[[procedure.config.stage]]
name = "Stage 1"
enabled = true
executions = [
  { execution.type = "RotateAllServerKeys", execution.params = {}, enabled = true }
]

##

[[procedure]]
name = "deploy-all-changed"
description = "Batch redeploys stacks whose compose changed. Triggered by Forgejo webhook on push to master."

[[procedure.config.stage]]
name = "Sync Resources"
enabled = true
executions = [
  { execution.type = "RunSync", execution.params.sync = "homelab-resources", enabled = true }
]

[[procedure.config.stage]]
name = "Stage 1"
enabled = true
executions = [
  { execution.type = "BatchDeployStackIfChanged", execution.params.pattern = "*", enabled = true }
]

##

[[resource_sync]]
name = "homelab-resources"
tags = ["config-as-code"]
[resource_sync.config]
linked_repo = "kazuki/homelab"
webhook_enabled = false
resource_path = [
  "komodo/resources/default.toml"
]
managed = true