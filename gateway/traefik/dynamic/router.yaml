    kinboard-api:
      entrypoints:
        - websecure
      rule: "Host(`planner.ts.kazuki.uk`) && (PathPrefix(`/rest`) || PathPrefix(`/auth`) || PathPrefix(`/storage`) || PathPrefix(`/realtime`))"
      priority: 100
      service: kinboard-api-service
      middlewares:
        - crowdsec
      tls:
        certResolver: cloudflare

    kinboard:
      entrypoints:
        - websecure
      rule: "Host(`planner.ts.kazuki.uk`)"
      priority: 1
      service: kinboard-service
      middlewares:
        - crowdsec
      tls:
