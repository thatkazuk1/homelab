http:
  routers:
    jellyfin:
      entrypoints:
        - websecure
      rule: "Host(`jellyfin.kazuki.uk`)"
      service: jellyfin-service
      middlewares:
        - crowdsec
      tls:
        certResolver: cloudflare

    navidrome:
      entrypoints:
        - websecure
      rule: "Host(`navidrome.kazuki.uk`)"
      service: navidrome-service
      middlewares:
        - crowdsec
      tls:
        certResolver: cloudflare

    ntfy:
      entrypoints:
        - websecure
      rule: "Host(`ntfy.kazuki.uk`)"
      service: ntfy-service
      middlewares:
        - crowdsec
      tls:
        certResolver: cloudflare

    plane:
      entrypoints:
        - websecure
      rule: "Host(`plane.kazuki.uk`)"
      service: plane-service
      middlewares:
        - crowdsec
      tls:
        certResolver: cloudflare

    seerr:
      entrypoints:
        - websecure
      rule: "Host(`seerr.kazuki.uk`)"
      service: seerr-service
      middlewares:
        - crowdsec
      tls:
        certResolver: cloudflare

    speedtest-tracker:
      entrypoints:
        - websecure
      rule: "Host(`speed.kazuki.uk`)"
      service: speedtest-tracker-service
      middlewares:
        - crowdsec
      tls:
        certResolver: cloudflare

    backrest:
      entrypoints:
        - websecure
      rule: "Host(`backrest.ts.kazuki.uk`)"
      service: backrest-service
      middlewares:
        - tailscale-whitelist
      tls:
        certResolver: cloudflare

    beszel:
      entrypoints:
        - websecure
      rule: "Host(`beszel.ts.kazuki.uk`)"
      service: beszel-service
      middlewares:
        - crowdsec
      tls:
        certResolver: cloudflare

    coolify:
      entrypoints:
        - websecure
      rule: "Host(`coolify.ts.kazuki.uk`)"
      service: coolify-service
      middlewares:
        - tailscale-whitelist
      tls:
        certResolver: cloudflare

    coolify-terminal:
      entrypoints:
        - websecure
      rule: "Host(`coolify.ts.kazuki.uk`) && PathPrefix(`/terminal/ws`)"
      service: coolify-terminal-service
      middlewares:
        - tailscale-whitelist
      tls:
        certResolver: cloudflare

    coolify-realtime:
      entrypoints:
        - websecure
      rule: "Host(`coolify.ts.kazuki.uk`) && PathPrefix(`/app`)"
      service: coolify-realtime-service
      middlewares:
        - tailscale-whitelist
      tls:
        certResolver: cloudflare

    coolify-webhook:
      entrypoints:
        - websecure
      rule: "Host(`coolify.kazuki.uk`) && PathPrefix(`/webhooks`)"
      service: coolify-service
      middlewares:
        - crowdsec
      tls:
        certResolver: cloudflare

    crowdsec-manager:
      entrypoints:
        - websecure
      # Origin rule: match only when the request has no Origin header, or when
      # the Origin is the own host name. This stops cross-site requests and
      # cross-site WebSockets from a web page in the operator's browser.
      rule: "Host(`crowdsec.ts.kazuki.uk`) && (!HeaderRegexp(`Origin`, `.+`) || Header(`Origin`, `https://crowdsec.ts.kazuki.uk`))"
      service: crowdsec-manager-service
      middlewares:
        - crowdsec-manager-allowlist
        - crowdsec-manager-auth
      tls:
        certResolver: cloudflare

    crowdsec-manager-blocked:
      entrypoints:
        - websecure
      rule: "Host(`crowdsec.ts.kazuki.uk`) && (PathPrefix(`/api/terminal`) || PathPrefix(`/api/update`) || PathPrefix(`/api/services/shutdown`))"
      priority: 10000
      service: crowdsec-manager-service
      middlewares:
        - crowdsec-manager-allowlist
        - crowdsec-manager-deny
      tls:
        certResolver: cloudflare

    dockhand:
      entrypoints:
        - websecure
      rule: "Host(`dockhand.ts.kazuki.uk`)"
      service: dockhand-service
      middlewares:
        - tailscale-whitelist
      tls:
        certResolver: cloudflare

    forgejo:
      entrypoints:
        - websecure
      rule: "Host(`forgejo.ts.kazuki.uk`)"
      service: forgejo-service
      middlewares:
        - tailscale-whitelist
      tls:
        certResolver: cloudflare

    garage-ui:
      entrypoints:
        - websecure
      rule: "Host(`garage.ts.kazuki.uk`)"
      service: garage-ui-service
      middlewares:
        - crowdsec
      tls:
        certResolver: cloudflare

    garage-s3:
      entrypoints:
        - websecure
      rule: "Host(`garage-s3.ts.kazuki.uk`)"
      service: garage-s3-service
      middlewares:
        - tailscale-whitelist
      tls:
        certResolver: cloudflare

    git:
      entrypoints:
        - websecure
      rule: "Host(`git.ts.kazuki.uk`)"
      service: forgejo-service
      middlewares:
        - tailscale-whitelist
      tls:
        certResolver: cloudflare

    homeassistant:
      entrypoints:
        - websecure
      rule: "Host(`ha.ts.kazuki.uk`)"
      service: homeassistant-service
      middlewares:
        - tailscale-whitelist
      tls:
        certResolver: cloudflare

    homepage:
      entrypoints:
        - websecure
      rule: "Host(`home.ts.kazuki.uk`)"
      service: homepage-service
      middlewares:
        - tailscale-whitelist
        - crowdsec
      tls:
        certResolver: cloudflare

    influxdb-explorer:
      entrypoints:
        - websecure
      rule: "Host(`influxdb-explorer.ts.kazuki.uk`)"
      service: influxdb-explorer-service
      middlewares:
        - tailscale-whitelist
      tls:
        certResolver: cloudflare

    komodo:
      entrypoints:
        - websecure
      rule: "Host(`komodo.ts.kazuki.uk`)"
      service: komodo-service
      middlewares:
        - tailscale-whitelist
      tls:
        certResolver: cloudflare

    sure:
      entrypoints:
        - websecure
      rule: "Host(`sure.ts.kazuki.uk`)"
      service: sure-service
      middlewares:
        - crowdsec
        - sure-ssl-header
      tls:
        certResolver: cloudflare

    uptime-kuma:
      entrypoints:
        - websecure
      rule: "Host(`uptime.ts.kazuki.uk`)"
      service: uptime-kuma-service
      middlewares:
        - tailscale-whitelist
      tls:
        certResolver: cloudflare

    vaultwarden:
      entrypoints:
        - websecure
      rule: "Host(`vault.ts.kazuki.uk`)"
      service: vaultwarden-service
      middlewares:
        - crowdsec
      tls:
        certResolver: cloudflare

    kinboard-api:
      entrypoints:
        - websecure
      rule: "Host(`planner.ts.kazuki.uk`) && (PathPrefix(`/rest`) || PathPrefix(`/auth`) || PathPrefix(`/storage`) || PathPrefix(`/realtime`))"
      priority: 100
      service: kinboard-api-service
      middlewares:
        - crowdsec
      tls:
        certResolver: cloudflare

    kinboard:
      entrypoints:
        - websecure
      rule: "Host(`planner.ts.kazuki.uk`)"
      priority: 1
      service: kinboard-service
      middlewares:
        - crowdsec
      tls:
        certResolver: cloudflare

    sparkyfitness:
      entrypoints:
        - websecure
      rule: "Host(`sparkyfitness.ts.kazuki.uk`)"
      service: sparkyfitness-service
      middlewares:
        - crowdsec
      tls:
        certResolver: cloudflare

    # Coolify tenant hostnames. The Cloudflare tunnels send these names here
    # first (hop 1). The service then forwards to Coolify's own Traefik (hop 2).
    # tls: {} on purpose: an empty tls block does not inherit the entrypoint
    # certResolver, so Traefik serves its default certificate and starts no
    # ACME order for these names. The tunnels use noTLSVerify.
    tenant-status:
      entrypoints:
        - websecure
      rule: "Host(`status.kazuki.uk`)"
      service: coolify-tenants-service
      middlewares:
        - crowdsec
      tls: {}

    tenant-netwright:
      entrypoints:
        - websecure
      rule: "Host(`netwright.kazuki.uk`)"
      service: coolify-tenants-service
      middlewares:
        - crowdsec
      tls: {}

    tenant-school:
      entrypoints:
        - websecure
      rule: "Host(`school.kazuki.uk`)"
      service: coolify-tenants-service
      middlewares:
        - crowdsec
      tls: {}

    tenant-oriweave:
      entrypoints:
        - websecure
      rule: "Host(`oriweave.dev`)"
      service: coolify-tenants-service
      middlewares:
        - crowdsec
      tls: {}

    tenant-api-oriweave:
      entrypoints:
        - websecure
      rule: "Host(`api.oriweave.dev`)"
      service: coolify-tenants-service
      middlewares:
        - crowdsec
      tls: {}

    tenant-docs-oriweave:
      entrypoints:
        - websecure
      rule: "Host(`docs.oriweave.dev`)"
      service: coolify-tenants-service
      middlewares:
        - crowdsec
      tls: {}

    tenant-dev-oriweave:
      entrypoints:
        - websecure
      rule: "Host(`dev.oriweave.dev`)"
      service: coolify-tenants-service
      middlewares:
        - crowdsec
      tls: {}

    tenant-api-dev-oriweave:
      entrypoints:
        - websecure
      rule: "Host(`api-dev.oriweave.dev`)"
      service: coolify-tenants-service
      middlewares:
        - crowdsec
      tls: {}

    tenant-docs-dev-oriweave:
      entrypoints:
        - websecure
      rule: "Host(`docs-dev.oriweave.dev`)"
      service: coolify-tenants-service
      middlewares:
        - crowdsec
      tls: {}

  middlewares:
    sure-ssl-header:
      headers:
        customRequestHeaders:
          X-Forwarded-Ssl: "on"

  serversTransports:
    # Hop 2 to Coolify's Traefik. Same trust as the tunnel noTLSVerify setting.
    coolify-tenants-transport:
      insecureSkipVerify: true

  services:
    backrest-service:
      loadBalancer:
        servers:
          - url: "http://192.168.50.105:9898"

    beszel-service:
      loadBalancer:
        servers:
          - url: "http://192.168.50.105:8090"

    coolify-service:
      loadBalancer:
        servers:
          - url: "http://192.168.50.30:8000"

    coolify-terminal-service:
      loadBalancer:
        servers:
          - url: "http://192.168.50.30:6002"

    coolify-realtime-service:
      loadBalancer:
        servers:
          - url: "http://192.168.50.30:6001"

    crowdsec-manager-service:
      loadBalancer:
        servers:
          - url: "http://crowdsec-manager:8080"

    dockhand-service:
      loadBalancer:
        servers:
          - url: "http://192.168.50.105:3050"

    forgejo-service:
      loadBalancer:
        servers:
          - url: "http://192.168.50.108:3000"

    garage-s3-service:
      loadBalancer:
        servers:
          - url: "http://192.168.50.80:3900"

    garage-ui-service:
      loadBalancer:
        servers:
          - url: "http://192.168.50.80:3909"

    homeassistant-service:
      loadBalancer:
        servers:
          - url: "http://192.168.50.3:8123"

    homepage-service:
      loadBalancer:
        servers:
          - url: "http://192.168.50.105:3000"

    influxdb-explorer-service:
      loadBalancer:
        servers:
          - url: "http://192.168.50.106:8888"

    jellyfin-service:
      loadBalancer:
        servers:
          - url: "http://192.168.50.163:8096"

    navidrome-service:
      loadBalancer:
        servers:
          - url: "http://192.168.50.163:4533"

    komodo-service:
      loadBalancer:
        servers:
          - url: "http://192.168.50.111:9120"

    ntfy-service:
      loadBalancer:
        servers:
          - url: "http://192.168.50.3:8085"

    plane-service:
      loadBalancer:
        servers:
          - url: "http://192.168.50.50:80"

    seerr-service:
      loadBalancer:
        servers:
          - url: "http://192.168.50.163:5055"

    speedtest-tracker-service:
      loadBalancer:
        servers:
          - url: "http://192.168.50.106:8080"

    sure-service:
      loadBalancer:
        servers:
          - url: "http://192.168.50.105:3001" 
   
    uptime-kuma-service:
      loadBalancer:
        servers:
          - url: "http://192.168.50.3:3001"

    vaultwarden-service:
      loadBalancer:
        servers:
          - url: "http://192.168.50.105:8000"

    kinboard-api-service:
      loadBalancer:
        servers:
          - url: "http://192.168.50.100:8100"

    kinboard-service:
      loadBalancer:
        servers:
          - url: "http://192.168.50.100:3001"

    sparkyfitness-service:
      loadBalancer:
        servers:
          - url: "http://192.168.50.100:3004"

    coolify-tenants-service:
      loadBalancer:
        passHostHeader: true
        serversTransport: coolify-tenants-transport
        servers:
          - url: "https://192.168.50.30:443"
