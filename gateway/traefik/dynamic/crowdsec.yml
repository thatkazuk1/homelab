http:
  middlewares:
    crowdsec:
      plugin:
        bouncer:
          enabled: true
          logLevel: INFO
          crowdsecMode: live
          updateMaxFailure: -1
          crowdsecLapiKeyFile: /etc/traefik/secrets/crowdsec-lapi-key
          crowdsecLapiHost: crowdsec:8080
          crowdsecLapiScheme: http
          clientTrustedIPs:
            - "100.64.0.0/10"
            - "172.16.0.0/12"
